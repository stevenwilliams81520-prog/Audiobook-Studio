<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" id="theme-color" content="#f2f2f7">
<script>try{var p=localStorage.getItem('abs_theme')||'auto';if(p==='dark'||(p==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');}catch(e){}</script>
<title>Audiobook Studio</title>
<style>
/* Light = "Bright", dark = "Studio Dark" (follows the iPhone's appearance setting) */
:root {
  --bg: #f2f2f7; --panel: #ffffff; --panel2: #f2f2f7; --ink: #111114; --muted: #6b6b75; --line: #e3e3ea;
  --accent: #5b4cf0; --accent-ink: #ffffff; --acc-soft: #ece9ff; --gold: #c47f12; --danger: #d6342c; --ok: #13866f;
  --lane: #f7f7fa; --lane2: #efeff4; --hdr: #ffffff; --ph: #5b4cf0; --tabs: #ffffff; --top: #f2f2f7;
  --card-bd: transparent; --in-bd: transparent; --r-card: 22px; --r-in: 14px; --r-btn: 12px; --r-pri: 25px;
  --clip-mix: 26%; --clip-ink: #111114; --clip-shadow: 0 0 3px #ffffff; --wave: #111114; --time: #111114;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  --hdrw: 104px;
  color-scheme: light;
}
html.dark {
    --bg: #0f1115; --panel: #171a21; --panel2: #0f1115; --ink: #eef0f4; --muted: #9aa1ad; --line: #262a33;
    --accent: #2dd4bf; --accent-ink: #062a26; --acc-soft: #12302c; --gold: #f5b14c; --danger: #ff6b5b; --ok: #4ade80;
    --lane: #0b0c10; --lane2: #0e1014; --hdr: #12141a; --ph: #2dd4bf; --tabs: #12141a; --top: #0f1115;
    --card-bd: #262a33; --in-bd: #262a33; --r-card: 16px; --r-in: 12px; --r-btn: 12px; --r-pri: 12px;
    --clip-mix: 88%; --clip-ink: #0b0c10; --clip-shadow: none; --wave: #0b0c10; --time: #2dd4bf;
    color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
body { font: 15px/1.4 -apple-system, BlinkMacSystemFont, Inter, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
button, input, select, textarea { font: inherit; color: inherit; }
#app { display: flex; flex-direction: column; height: 100%; height: 100dvh; }
.top { display: flex; align-items: center; gap: 8px; padding: calc(8px + var(--safe-t)) 12px 8px; background: var(--top); border-bottom: 1px solid var(--line); }
.top.home { border-bottom: 0; padding: calc(14px + var(--safe-t)) 18px 4px; }
.top.home h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
.top .acc { color: var(--time); }
.top h1 { font-size: 17px; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .eng { font-size: 11px; color: var(--muted); white-space: nowrap; }
main { flex: 1; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch; }
main.studio { overflow: hidden; display: flex; flex-direction: column; }
.tabs { display: flex; background: var(--tabs); border-top: 1px solid var(--line); padding-bottom: var(--safe-b); }
.tabs button { flex: 1; border: 0; background: none; padding: 10px 2px 9px; font-size: 12px; font-weight: 600; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; }
.tabs button svg { width: 22px; height: 22px; }
.tabs button.on { color: var(--accent); }
.wrap { max-width: 760px; margin: 0 auto; padding: 14px 14px 28px; }
.card { background: var(--panel); border: 1px solid var(--card-bd); border-radius: var(--r-card); padding: 16px; margin-bottom: 14px; }
.card h2 { font-size: 17px; margin: 0 0 10px; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
label.f { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin: 10px 0 4px; }
input[type=text], input[type=number], select, textarea { width: 100%; font-size: 16px; background: var(--panel2); border: 1px solid var(--in-bd); border-radius: var(--r-in); padding: 10px 12px; }
textarea { resize: vertical; min-height: 120px; line-height: 1.45; }
textarea.script { min-height: 46vh; font-size: 15px; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { border-radius: var(--r-btn); padding: 11px 14px; font-weight: 600; background: var(--panel2); border: 1px solid var(--in-bd); cursor: pointer; white-space: nowrap; min-height: 44px; }
.btn.p { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); border-radius: var(--r-pri); font-weight: 700; }
.btn.d { color: var(--danger); }
.btn.sm { padding: 6px 12px; font-size: 13px; border-radius: 10px; min-height: 36px; }
.btn:disabled { opacity: .45; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.btns.full .btn { flex: 1; }
.list .item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--card-bd); background: var(--panel); border-radius: 16px; margin-bottom: 8px; }
.list .item .grow { flex: 1; min-width: 0; }
.list .item b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cover-sm { width: 46px; height: 46px; border-radius: 12px; background: var(--acc-soft) center/cover; flex: none; display: grid; place-items: center; color: var(--accent); font-weight: 800; }
.chbar { display: flex; gap: 6px; align-items: center; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
.chbar select { flex: 1; min-width: 0; padding: 7px 8px; }
.empty { text-align: center; padding: 40px 20px; color: var(--muted); }
.pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 99px; background: var(--lane2); color: var(--muted); }
.pill.ok { color: var(--ok); } .pill.warn { color: var(--gold); }

/* Studio */
.transport { display: flex; flex-direction: column; gap: 6px; padding: 8px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
.t-row { display: flex; align-items: center; gap: 6px; }
.t-acts .btn.sm { flex: 1; padding-left: 6px; padding-right: 6px; }
.t-acts label.btn.sm { text-align: center; }
#busy:empty { display: none; }
.dock { display: none; }
.transport::-webkit-scrollbar { display: none; }
.time { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 700; min-width: 74px; text-align: center; font-size: 15px; color: var(--time); }
.ib { width: 40px; height: 40px; flex: none; border-radius: 12px; border: 1px solid var(--in-bd); background: var(--panel2); display: grid; place-items: center; padding: 0; }
.ib svg { width: 20px; height: 20px; }
.ib.p { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); border-radius: 20px; }
.ib:disabled { opacity: .4; }
.sep { width: 1px; height: 26px; background: var(--line); flex: none; margin: 0 2px; }
@media (max-width: 430px) { .transport .sep { display: none; } .transport .time { min-width: 66px; } }
.tl { flex: 1; min-height: 120px; overflow: auto; position: relative; background: var(--lane); -webkit-overflow-scrolling: touch; touch-action: pan-x pan-y; }
.tl-inner { position: relative; min-width: 100%; }
.trow { display: flex; height: 64px; border-bottom: 1px solid var(--line); }
.trow.ruler-row { height: 26px; position: sticky; top: 0; z-index: 5; background: var(--hdr); }
.hdr { width: var(--hdrw); flex: none; position: sticky; left: 0; z-index: 4; background: var(--hdr); border-right: 1px solid var(--line); padding: 6px 6px 4px 8px; display: flex; flex-direction: column; justify-content: space-between; border-left: 4px solid var(--c, transparent); }
.hdr .tn { font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hdr .tb { display: flex; gap: 4px; }
.hdr .tb button { border: 1px solid var(--line); background: var(--panel2); border-radius: 6px; font-size: 11px; font-weight: 800; width: 26px; height: 22px; padding: 0; }
.hdr .tb button.on.m { background: var(--gold); color: #000; border-color: var(--gold); }
.hdr .tb button.on.s { background: var(--ok); color: #000; border-color: var(--ok); }
.hdr.sel { background: var(--panel2); }
.lane { position: relative; flex: 1; background: var(--lane); }
.trow:nth-child(odd) .lane { background: var(--lane2); }
.ruler { position: relative; flex: 1; cursor: pointer; }
.tick { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line); font-family: var(--mono); font-size: 10px; color: var(--muted); padding-left: 3px; padding-top: 6px; pointer-events: none; }
.clip { position: absolute; top: 5px; bottom: 5px; border-radius: 7px; background: color-mix(in srgb, var(--c) var(--clip-mix), var(--panel)); border: 1.5px solid var(--c); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
.clip.sel { box-shadow: 0 0 0 2px var(--ink); z-index: 2; }
.clip.pending { border-style: dashed; background: repeating-linear-gradient(45deg, transparent 0 6px, color-mix(in srgb, var(--c) 18%, transparent) 6px 12px); }
.clip.stale { opacity: .6; }
.clip.err { border-color: var(--danger); }
.clip canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.clip .lbl { position: absolute; left: 6px; right: 6px; top: 3px; font-size: 10.5px; font-weight: 700; color: var(--clip-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; text-shadow: var(--clip-shadow); }
.clip .h { position: absolute; top: 0; bottom: 0; width: 14px; touch-action: none; }
.clip .h-l { left: 0; } .clip .h-r { right: 0; }
.clip.sel .h { background: color-mix(in srgb, var(--ink) 22%, transparent); }
.playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ph); z-index: 6; pointer-events: none; }
.playhead::before { content: ""; position: absolute; top: 0; left: -5px; border: 6px solid transparent; border-top: 8px solid var(--ph); }
.insp { max-height: 42%; overflow: auto; background: var(--panel); border-top: 1px solid var(--line); padding: 10px 12px 14px; }
.insp h3 { font-size: 14px; margin: 0 0 4px; display: flex; gap: 8px; align-items: center; }
.insp .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.insp textarea { min-height: 70px; }
.rangev { float: right; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }

/* Modal & toast */
#modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: flex-end; justify-content: center; z-index: 50; }
#modal.on { display: flex; }
#modal .sheet { background: var(--panel); width: 100%; max-width: 560px; max-height: 88vh; overflow: auto; border-radius: 22px 22px 0 0; padding: 18px 16px calc(18px + var(--safe-b)); }
@media (min-width: 700px) { #modal { align-items: center; } #modal .sheet { border-radius: 18px; } }
#modal h2 { margin: 0 0 8px; font-size: 18px; }
.bar { height: 8px; background: var(--lane2); border-radius: 99px; overflow: hidden; margin: 12px 0 6px; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }
#toast { position: fixed; left: 50%; top: calc(64px + var(--safe-t)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 13.5px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 60; max-width: 90vw; text-align: center; }
#toast.on { opacity: 1; }
.cast-item { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: end; border: 1px solid var(--line); border-radius: 16px; padding: 10px; margin-bottom: 10px; border-left: 5px solid var(--c); }
.cast-item .full { grid-column: 1 / -1; }
.hidden { display: none !important; }
a { color: var(--accent); }

/* Quick speech: grouped rows + segmented format picker */
.group { background: var(--panel2); border: 1px solid var(--in-bd); border-radius: var(--r-in); overflow: hidden; margin-top: 10px; }
.qrow { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 12px; border-bottom: 1px solid var(--line); font-size: 15px; }
.qrow:last-child { border-bottom: 0; }
.qrow > span:first-child { flex: none; }
.qrow .gsel, .qrow .gin { flex: 1; width: auto; min-width: 0; border: 0; background: transparent; text-align: right; text-align-last: right; color: var(--muted); padding: 10px 0; border-radius: 0; }
.qrow .gsel:disabled { opacity: .5; }
.qrow input[type=range] { flex: 1; width: auto; min-width: 0; }
.gval { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 46px; text-align: right; }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 3px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--in-bd); margin-top: 10px; }
.seg button { border: 0; background: transparent; min-height: 38px; border-radius: 9px; font-weight: 600; color: var(--muted); font-size: 14px; cursor: pointer; }
.seg button.on { background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.14); }

/* Studio Dark: big play dock at the bottom of the studio */
html.dark .transport .t-main { display: none; }
html.dark .t-acts .btn.sm { border-radius: 18px; }
html.dark .dock { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 12px 10px; background: var(--bg); border-top: 1px solid var(--line); }
html.dark .dock .time { font-size: 20px; min-width: 0; }
html.dark .dock .dbtns { display: flex; align-items: center; gap: 12px; }
html.dark .dock .ib { width: 44px; height: 44px; border-radius: 22px; }
html.dark .dock .ib.big { width: 64px; height: 64px; border-radius: 32px; }
html.dark .dock .ib.big svg { width: 28px; height: 28px; }
html.dark .seg button.on { background: var(--accent); color: var(--accent-ink); box-shadow: none; }

/* Follow-along captions */
.captions { max-height: 210px; overflow: auto; margin-top: 10px; padding: 10px 12px; border-radius: var(--r-in); background: var(--panel2); border: 1px solid var(--in-bd); font-size: 17px; line-height: 1.6; }
.cseg { margin: 0 0 8px; color: var(--muted); transition: color .15s; }
.cseg:last-child { margin-bottom: 0; }
.cseg.cur { color: var(--ink); }
.cw { border-radius: 5px; padding: 1px 2px; margin: 0 -2px; cursor: pointer; }
.cw.now { background: var(--accent); color: var(--accent-ink); }
.cwho { font-size: 13px; letter-spacing: .02em; }
.ccbar { position: relative; max-height: 104px; overflow: auto; padding: 8px 12px; background: var(--panel); border-top: 1px solid var(--line); font-size: 17px; line-height: 1.5; }
.ccbar.dim .cseg { opacity: .55; }
.ccbar .cseg { margin-bottom: 4px; }
.t-acts .cc-btn { flex: none; font-weight: 800; letter-spacing: .04em; }
.t-acts .cc-btn.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* Appearance picker */
.theme-seg { margin-top: 4px; }
.top .ib.gear { margin-left: auto; }

/* Speed reader */
.cap-seg { margin-top: 10px; }
.rsvp-box { margin-top: 10px; padding: 4px 12px; border-radius: var(--r-in); background: var(--panel2); border: 1px solid var(--in-bd); cursor: pointer; }
.rsvp { display: flex; flex-direction: column; gap: 4px; padding: 6px 0 8px; }
.rsvp-who { text-align: center; font-size: 12px; font-weight: 700; min-height: 16px; color: var(--muted); }
.rsvp-line { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; font-size: 40px; font-weight: 600; line-height: 1.25; padding: 12px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); letter-spacing: .01em; }
.rsvp-line::before, .rsvp-line::after { content: ""; position: absolute; left: 50%; width: 2px; height: 9px; margin-left: -1px; background: var(--muted); }
.rsvp-line::before { top: 0; } .rsvp-line::after { bottom: 0; }
.rp { text-align: right; white-space: pre; overflow: hidden; }
.rq { text-align: left; white-space: pre; overflow: hidden; }
.ro { color: var(--danger); }
.rsvp.dim .rsvp-line { opacity: .38; }
.rsvp-bar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 4px; }
.rsvp-bar i { display: block; height: 100%; width: 0; background: var(--accent); }
.ccmode { position: absolute; top: 6px; right: 8px; z-index: 1; margin: 0; padding: 2px; gap: 2px; grid-template-columns: repeat(2, auto); }
.ccmode button { min-height: 26px; padding: 0 10px; font-size: 12px; }
.ccbar #ccb { padding-right: 112px; }
.ccbar.rsvp-mode { max-height: none; overflow: visible; }
.ccbar.rsvp-mode #ccb { padding-right: 0; }
.ccbar.rsvp-mode .rsvp-line { font-size: 34px; padding: 8px 0; }
.ccbar.rsvp-mode .rsvp-who { text-align: left; }

/* Scan screens (full screen, always dark like a camera view) */
#scanview { position: fixed; inset: 0; z-index: 55; background: #000; color: #f2f2f5; display: flex; flex-direction: column; padding: var(--safe-t) 0 var(--safe-b); }
.sv-top { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
.sv-top h2 { flex: 1; margin: 0; text-align: center; font-size: 16px; font-weight: 700; }
.sv-sub { display: block; font-size: 12px; font-weight: 500; color: #a8a8b3; }
.sv-dark { background: #1f1f24 !important; border-color: #2c2c33 !important; color: #f2f2f5 !important; }
.sv-stage { flex: 1; min-height: 0; position: relative; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
.sv-img { position: absolute; z-index: 1; }
.sv-sel { position: absolute; z-index: 2; border: 2px solid #fff; border-radius: 4px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, .58); pointer-events: none; }
.sv-h { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 13px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.5); pointer-events: auto; }
.sv-h::before { content: ""; position: absolute; inset: -10px; }
.sv-h[data-c=tl] { left: 0; top: 0; } .sv-h[data-c=tr] { left: 100%; top: 0; }
.sv-h[data-c=bl] { left: 0; top: 100%; } .sv-h[data-c=br] { left: 100%; top: 100%; }
.sv-words { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.sv-w { position: absolute; border-radius: 4px; background: rgba(91, 76, 240, .34); box-shadow: inset 0 0 0 1.5px rgba(140, 128, 255, .95); }
.sv-w.low { background: rgba(245, 160, 40, .34); box-shadow: inset 0 0 0 1.5px rgba(245, 177, 76, .95); }
.sv-w.off { background: rgba(0, 0, 0, .35); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .25); }
.sv-hint { margin: 0; padding: 8px 16px 0; font-size: 13px; line-height: 1.4; color: #b9b9c3; text-align: center; }
.sv-low-key { color: #f5b14c; font-weight: 700; }
.sv-bot { display: flex; gap: 8px; padding: 10px 12px 12px; }
.sv-bot .btn { flex: 1; }
#modal { z-index: 58; }

</style>
</head>

<div id="modal"></div>

/* ===== MP4 / M4A / M4B muxer (AAC audio + QuickTime chapter track + Nero chpl + iTunes tags) ===== */
const MP4 = (() => {
  const te = new TextEncoder();
  const hex = h => new Uint8Array(h.match(/../g).map(b => parseInt(b, 16)));
  const u8 = v => new Uint8Array([v & 255]);
  const u16 = v => new Uint8Array([(v >> 8) & 255, v & 255]);
  const u32 = v => new Uint8Array([(v >>> 24) & 255, (v >>> 16) & 255, (v >>> 8) & 255, v & 255]);
  const u64 = v => { const hi = Math.floor(v / 4294967296), lo = v >>> 0; return cat([u32(hi), u32(lo)]); };
  const str = s => te.encode(s);
  function cat(parts) {
    let n = 0; for (const p of parts) n += p.length;
    const out = new Uint8Array(n); let o = 0;
    for (const p of parts) { out.set(p, o); o += p.length; }
    return out;
  }
  function box(type, ...parts) {
    const body = cat(parts.flat());
    return cat([u32(body.length + 8), Uint8Array.from(type, ch => ch.charCodeAt(0) & 255), body]);
  }
  const full = (type, ver, flags, ...parts) => box(type, u8(ver), u8(flags >> 16), u16(flags & 0xffff), ...parts);
  const MATRIX = cat([u32(0x10000), u32(0), u32(0), u32(0), u32(0x10000), u32(0), u32(0), u32(0), u32(0x40000000)]);

  // Captured from a known-good ffmpeg/iTunes chapter track
  const CHAP_GMHD = hex('0000004c676d686400000018676d696e000000000040800080008000000000000000002c74657874000100000000000000000000000000000001000000000000000000000000000040000000');
  const CHAP_STSD = hex('0000004b7374736400000000000000010000003b7465787400000000000000010000000100000000000000000000000000000000000000010000000000000000000d667461620001000100');
  const ENCD = hex('0000000c656e636400000100');

  function descr(tag, body) { return cat([u8(tag), u8(0x80), u8(0x80), u8(0x80), u8(body.length), body]); }
  function esds(asc, bitrate) {
    const dsi = descr(5, asc);
    const dcd = descr(4, cat([u8(0x40), u8(0x15), u8(0), u16(0), u32(bitrate), u32(bitrate), dsi]));
    const es = descr(3, cat([u16(1), u8(0), dcd, descr(6, u8(2))]));
    return full('esds', 0, 0, es);
  }
  // Fallback AudioSpecificConfig for AAC-LC
  function makeASC(sr, ch) {
    const rates = [96000, 88200, 64000, 48000, 44100, 32000, 24000, 22050, 16000, 12000, 11025, 8000, 7350];
    const fi = rates.indexOf(sr);
    return new Uint8Array([(2 << 3) | (fi >> 1), ((fi & 1) << 7) | (ch << 3)]);
  }

  function stbl(stsd, deltas, sizes, offsets) {
    // stts: run-length compress deltas
    const runs = [];
    for (const d of deltas) { const r = runs[runs.length - 1]; if (r && r[1] === d) r[0]++; else runs.push([1, d]); }
    return box('stbl',
      stsd,
      full('stts', 0, 0, u32(runs.length), ...runs.map(([c, d]) => cat([u32(c), u32(d)]))),
      full('stsc', 0, 0, u32(1), u32(1), u32(offsets.length === 1 ? sizes.length : 1), u32(1)),
      full('stsz', 0, 0, u32(0), u32(sizes.length), ...sizes.map(u32)),
      full('stco', 0, 0, u32(offsets.length), ...offsets.map(u32)));
  }

  function tagAtom(name, text) {
    return box(name, full('data', 0, 1, u32(0), str(text)));
  }

  /**
   * Build an M4A/M4B file.
   * @param {object} o { sampleRate, channels, bitrate, asc, packets: Uint8Array[], chapters: [{title,start(sec)}],
   *                     totalSamples, meta: {title, artist, album, narrator, genre, year, cover: {bytes, type:'jpeg'|'png'}}, brand:'M4A '|'M4B ' }
   * @returns Blob
   */
  function build(o) {
    const sr = o.sampleRate, ts = sr;
    const nPk = o.packets.length;
    const audioDur = nPk * 1024;
    const brand = o.brand || 'M4A ';
    const ftyp = box('ftyp', str(brand), u32(0x200), str(brand), str('M4A '), str('mp42'), str('isom'));

    // chapter samples
    const chaps = (o.chapters || []).filter(c => c && c.title != null);
    const chapSamples = chaps.map(c => { const t = str(String(c.title).slice(0, 255)); return cat([u16(t.length), t, ENCD]); });
    const chapTs = 1000;
    const totalMs = Math.round(audioDur / sr * 1000);
    const chapStartsMs = chaps.map(c => Math.max(0, Math.round(c.start * 1000)));
    const chapDeltas = chapStartsMs.map((s, i) => Math.max(1, (i + 1 < chapStartsMs.length ? chapStartsMs[i + 1] : totalMs) - s));

    // mdat layout: [header][audio packets][chapter samples]
    let audioBytes = 0; for (const p of o.packets) audioBytes += p.length;
    let chapBytes = 0; for (const s of chapSamples) chapBytes += s.length;
    const mdatSize = 8 + audioBytes + chapBytes;
    const mdatHdr = cat([u32(mdatSize), str('mdat')]);
    const audioOffset = ftyp.length + 8;
    const chapOffsets = []; let off = audioOffset + audioBytes;
    for (const s of chapSamples) { chapOffsets.push(off); off += s.length; }

    const hasChap = chaps.length > 0;
    const mvhd = full('mvhd', 0, 0, u32(0), u32(0), u32(ts), u32(audioDur), u32(0x10000), u16(0x100), u16(0), u32(0), u32(0),
      MATRIX, u32(0), u32(0), u32(0), u32(0), u32(0), u32(0), u32(hasChap ? 3 : 2));

    const mp4a = box('mp4a', new Uint8Array(6), u16(1), u32(0), u32(0), u16(o.channels), u16(16), u16(0), u16(0), u32(sr << 16 >>> 0),
      esds(o.asc || makeASC(sr, o.channels), o.bitrate));
    const audioTrak = box('trak',
      full('tkhd', 0, 3, u32(0), u32(0), u32(1), u32(0), u32(audioDur), u32(0), u32(0), u16(0), u16(0), u16(0x100), u16(0), MATRIX, u32(0), u32(0)),
      hasChap ? box('tref', box('chap', u32(2))) : [],
      box('mdia',
        full('mdhd', 0, 0, u32(0), u32(0), u32(ts), u32(audioDur), u16(0x55c4), u16(0)),
        full('hdlr', 0, 0, u32(0), str('soun'), u32(0), u32(0), u32(0), str('SoundHandler\0')),
        box('minf',
          full('smhd', 0, 0, u32(0)),
          box('dinf', full('dref', 0, 0, u32(1), full('url ', 0, 1))),
          stbl(full('stsd', 0, 0, u32(1), mp4a), new Array(nPk).fill(1024), o.packets.map(p => p.length), [audioOffset]))));

    const chapTrak = !hasChap ? [] : box('trak',
      full('tkhd', 0, 0, u32(0), u32(0), u32(2), u32(0), u32(audioDur), u32(0), u32(0), u16(0), u16(0), u16(0), u16(0), MATRIX, u32(0), u32(0)),
      box('mdia',
        full('mdhd', 0, 0, u32(0), u32(0), u32(chapTs), u32(totalMs), u16(0), u16(0)),
        full('hdlr', 0, 0, u32(0), str('text'), u32(0), u32(0), u32(0), str('SubtitleHandler\0')),
        box('minf',
          CHAP_GMHD,
          box('dinf', full('dref', 0, 0, u32(1), full('url ', 0, 1))),
          box('stbl',
            CHAP_STSD,
            full('stts', 0, 0, u32(chapDeltas.length), ...chapDeltas.map(d => cat([u32(1), u32(d)]))),
            full('stsc', 0, 0, u32(1), u32(1), u32(1), u32(1)),
            full('stsz', 0, 0, u32(0), u32(chapSamples.length), ...chapSamples.map(s => u32(s.length))),
            full('stco', 0, 0, u32(chapOffsets.length), ...chapOffsets.map(u32))))));

    // iTunes metadata
    const m = o.meta || {};
    const tags = [];
    if (m.title) tags.push(tagAtom('©nam', m.title));
    if (m.artist) tags.push(tagAtom('©ART', m.artist));
    if (m.album || m.title) tags.push(tagAtom('©alb', m.album || m.title));
    if (m.narrator) tags.push(tagAtom('©wrt', m.narrator));
    if (m.year) tags.push(tagAtom('©day', String(m.year)));
    tags.push(tagAtom('©gen', m.genre || 'Audiobook'));
    tags.push(tagAtom('©too', 'Audiobook Studio'));
    if (brand === 'M4B ') tags.push(box('stik', full('data', 0, 21, u32(0), u8(2))));
    if (m.cover && m.cover.bytes) tags.push(box('covr', full('data', 0, m.cover.type === 'png' ? 14 : 13, u32(0), m.cover.bytes)));
    const meta = full('meta', 0, 0,
      full('hdlr', 0, 0, u32(0), str('mdir'), str('appl'), u32(0), u32(0), u8(0)),
      box('ilst', ...tags));
    // Nero chapters (read by many non-Apple players)
    const chpl = !hasChap ? [] : full('chpl', 1, 0, u32(0), u8(Math.min(255, chaps.length)),
      ...chaps.slice(0, 255).map((c, i) => { const t = str(String(c.title).slice(0, 200)); return cat([u64(chapStartsMs[i] * 10000), u8(t.length), t]); }));
    const udta = box('udta', meta, chpl);

    const moov = box('moov', mvhd, audioTrak, chapTrak, udta);
    return new Blob([ftyp, mdatHdr, ...o.packets, ...chapSamples, moov], { type: brand === 'M4B ' ? 'audio/mp4' : 'audio/mp4' });
  }

  return { build, makeASC };
})();

/* ===== Storage (IndexedDB) ===== */
const DB = (() => {
  let dbp;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      const r = indexedDB.open('audiobook-studio', 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains('projects')) d.createObjectStore('projects', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('audio')) d.createObjectStore('audio', { keyPath: 'id' });
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  async function run(store, mode, fn) {
    const d = await open();
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode);
      const req = fn(t.objectStore(store));
      let out;
      if (req) req.onsuccess = () => { out = req.result; };
      t.oncomplete = () => res(out);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error || new Error('Storage aborted (device storage full?)'));
    });
  }
  return {
    get: (s, k) => run(s, 'readonly', st => st.get(k)),
    put: (s, v) => run(s, 'readwrite', st => st.put(v)),
    del: (s, k) => run(s, 'readwrite', st => st.delete(k)),
    all: s => run(s, 'readonly', st => st.getAll()),
    keys: s => run(s, 'readonly', st => st.getAllKeys()),
  };
})();

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

/* ===== Audio library: clips' audio stored as Int16 per channel at the project sample rate ===== */
const AudioLib = (() => {
  const cache = new Map(); // id -> {sr, ch: Float32Array[], len, peaks}
  let cachedSamples = 0;
  const LIMIT = 30e6;

  function f32ToI16(f) {
    const o = new Int16Array(f.length);
    for (let i = 0; i < f.length; i++) { const s = f[i] < -1 ? -1 : f[i] > 1 ? 1 : f[i]; o[i] = s < 0 ? s * 0x8000 : s * 0x7fff; }
    return o;
  }
  function i16ToF32(a) {
    const o = new Float32Array(a.length);
    for (let i = 0; i < a.length; i++) o[i] = a[i] / 32768;
    return o;
  }
  function remember(id, rec) {
    if (cache.has(id)) return;
    cache.set(id, rec);
    cachedSamples += rec.len * rec.ch.length;
    for (const [k, v] of cache) {
      if (cachedSamples <= LIMIT || k === id) break;
      cache.delete(k); cachedSamples -= v.len * v.ch.length;
    }
  }
  function peaks(ch, sr) {
    const per = Math.max(1, Math.round(sr / 100)); // 100 peaks per second
    const n = Math.ceil(ch[0].length / per);
    const p = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      let m = 0; const e = Math.min(ch[0].length, (i + 1) * per);
      for (let c = 0; c < ch.length; c++) { const a = ch[c]; for (let j = i * per; j < e; j += 2) { const v = a[j] < 0 ? -a[j] : a[j]; if (v > m) m = v; } }
      p[i] = m;
    }
    return p;
  }
  async function save(ch, sr) {
    const id = 'a_' + uid();
    await DB.put('audio', { id, sr, len: ch[0].length, ch: ch.map(f32ToI16) });
    remember(id, { sr, ch, len: ch[0].length, peaks: peaks(ch, sr) });
    return id;
  }
  async function load(id) {
    if (cache.has(id)) { const v = cache.get(id); cache.delete(id); cache.set(id, v); return v; }
    const r = await DB.get('audio', id);
    if (!r) throw new Error('Missing audio for a clip — try regenerating it.');
    const ch = r.ch.map(i16ToF32);
    const rec = { sr: r.sr, ch, len: r.len, peaks: peaks(ch, r.sr) };
    remember(id, rec);
    return rec;
  }
  const peek = id => cache.get(id) || null;
  async function remove(id) { cache.delete(id); try { await DB.del('audio', id); } catch {} }
  return { save, load, peek, remove };
})();

/* ===== Helpers ===== */
async function resampleChannels(ch, fromSr, toSr, outChannels) {
  if (fromSr === toSr && ch.length === (outChannels || ch.length)) return ch;
  const len = Math.ceil(ch[0].length * toSr / fromSr);
  const nCh = outChannels || ch.length;
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const ctx = new OAC(nCh, len, toSr);
  const buf = ctx.createBuffer(ch.length, ch[0].length, fromSr);
  ch.forEach((d, i) => buf.copyToChannel ? buf.copyToChannel(d, i) : buf.getChannelData(i).set(d));
  const src = ctx.createBufferSource(); src.buffer = buf; src.connect(ctx.destination); src.start();
  const out = await ctx.startRendering();
  return Array.from({ length: nCh }, (_, i) => new Float32Array(out.getChannelData(i)));
}

async function decodeFileTo(file, sr) {
  const bytes = await file.arrayBuffer();

/* ===== Mixer ===== */
const Mixer = (() => {

})();

/* ===== Voice engines =====

 *          load() -> { sampleRate, voices: string[] }

const VOICES = [
  ['bm_george', 'George', 'British male'], ['bm_lewis', 'Lewis', 'British male'], ['bm_daniel', 'Daniel', 'British male'], ['bm_fable', 'Fable', 'British male'],
  ['bf_emma', 'Emma', 'British female'], ['bf_isabella', 'Isabella', 'British female'], ['bf_alice', 'Alice', 'British female'], ['bf_lily', 'Lily', 'British female'],
  ['am_michael', 'Michael', 'American male'], ['am_adam', 'Adam', 'American male'], ['am_fenrir', 'Fenrir', 'American male'], ['am_puck', 'Puck', 'American male'],
  ['am_echo', 'Echo', 'American male'], ['am_eric', 'Eric', 'American male'], ['am_liam', 'Liam', 'American male'], ['am_onyx', 'Onyx', 'American male'],
  ['af_heart', 'Heart', 'American female'], ['af_bella', 'Bella', 'American female'], ['af_nicole', 'Nicole', 'American female'], ['af_sarah', 'Sarah', 'American female'],
  ['af_sky', 'Sky', 'American female'], ['af_nova', 'Nova', 'American female'], ['af_river', 'River', 'American female'], ['af_kore', 'Kore', 'American female'],
  ['af_alloy', 'Alloy', 'American female'], ['af_aoede', 'Aoede', 'American female'], ['af_jessica', 'Jessica', 'American female'],

function chunkText(text, maxLen = 280) {

  if (!clean) return [];
  const sentences = clean.match(/[^.!?;:]+[.!?;:]+["'’”)\]]*\s*|[^.!?;:]+$/g) || [clean];

    s = s.trim(); if (!s) continue;
    if (s.length > maxLen) {

      push(w);
    } else if ((buf + ' ' + s).trim().length > maxLen) { push(buf); buf = s; }
    else buf = (buf + ' ' + s).trim();
  }
  push(buf);
  return out;

const Engine = (() => {
  let kind = null, impl = null, loading = null;
  const forced = new URLSearchParams(location.search).get('engine');
  const nativePlugin = () => window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.KokoroTTS;

  function pick(pref) {
    if (forced) return forced;
    if (pref && pref !== 'auto') return pref;
    return nativePlugin() ? 'native' : 'web';
  }

  const engines = {
    native: {
      label: 'On-device (native)',
      async load() { const r = await nativePlugin().load(); return r; },
      async synth(text, voice, speed) {
        const r = await nativePlugin().synthesize({ text, voice, speed });
        const bin = atob(r.pcm16), n = bin.length >> 1, f = new Float32Array(n);

    web: {
      label: 'In-app (web)',
      tts: null,
      async load(onProgress) {
        const { KokoroTTS } = await import('https://cdn.jsdelivr.net/npm/kokoro-js@1.2.1/dist/kokoro.web.js');
        const files = {};
        this.tts = await KokoroTTS.from_pretrained('onnx-community/Kokoro-82M-v1.0-ONNX', {
          dtype: 'q8', device: 'wasm',
          progress_callback: p => {
            if (p.status === 'progress' && p.total) {
              files[p.file] = [p.loaded, p.total];
              let l = 0, t = 0; for (const [a, b] of Object.values(files)) { l += a; t += b; }

            }

      },
      async synth(text, voice, speed) {
        const parts = []; let n = 0;
        for (const c of chunkText(text)) {

    },
    mock: {
      label: 'Test tones',
      async load() { return { sampleRate: 24000 }; },
      async synth(text, voice, speed) {
        const sr = 24000, words = text.split(/\s+/).filter(Boolean);
        const base = 110 + (voice.charCodeAt(3) % 12) * 15 + (voice[1] === 'f' ? 90 : 0);

      }
    }
  };

  return {
    get kind() { return kind; },
    label(k) { return (engines[k || kind] || {}).label || ''; },
    available() { return { native: !!nativePlugin(), web: true, mock: true }; },
    async ensure(pref, onProgress) {
      const k = pick(pref);

    async synth(pref, text, voice, speed, onProgress) {

})();

/* ===== Follow-along captions: words highlighted while audio plays =====

/* ---------- model ---------- */
function newTrack(name, kind, castId, i) { return { id: 't_' + uid(), name, kind, castId: castId || null, gain: 1, mute: false, solo: false, color: COLORS[(i || 0) % COLORS.length] }; }
function newChapter(title) { return { id: 'c_' + uid(), title, script: '', autoFlow: true, tracks: [newTrack('Narrator', 'voice', 'narrator', 0)], clips: [] }; }
function newProject(title, opts = {}) {
  const ch = newChapter('Chapter 1');
  return {
    id: 'p_' + uid(), title: title || 'Untitled audiobook', author: '', narrator: '', genre: 'Audiobook', year: '', cover: null,
    sampleRate: opts.sampleRate || 24000, channels: opts.channels || 1, engine: 'auto',
    paraGap: 0.7, lineGap: 0.3, chapterGap: 2, exportFormat: 'm4b', exportScope: 'book', bitrate: 64,
    cast: [{ id: 'narrator', name: 'Narrator', voice: 'bm_george', speed: 1, color: COLORS[0] }],
    chapters: [ch], created: Date.now(), updated: Date.now(), v: 1

}
function reflow(ch) {
  if (!ch || !ch.autoFlow) return;
  const seq = ch.clips.filter(c => c.seq != null).sort((a, b) => a.seq - b.seq);
  let t = ch.flowStart || 0;
  for (const c of seq) { c.start = t; t += c.dur + (c.gapAfter || 0); }
}
function estDur(text, speed) { return Math.max(0.8, text.length / 15 / (speed || 1)); }
function voiceTrackFor(ch, castId) {
  let t = ch.tracks.find(t => t.kind === 'voice' && t.castId === castId);
  if (!t) {
    const cast = castById(castId);
    t = newTrack(cast.name, 'voice', castId, ch.tracks.length);
    t.color = cast.color;
    const lastVoice = ch.tracks.map(x => x.kind).lastIndexOf('voice');
    ch.tracks.splice(lastVoice + 1, 0, t);
  }
  return t;
}

/* ---------- script parsing ---------- */
const SPEAKER_RE = /^([A-Za-zÀ-ɏ0-9][A-Za-zÀ-ɏ0-9 .'’\-]{0,38}):\s*(.*)$/;
function parseScript(text, cast, paraGap, lineGap) {
  const lines = text.replace(/\r/g, '').split('\n');
  const blocks = []; let cur = null;
  const byName = new Map(cast.map(c => [c.name.trim().toLowerCase(), c]));
  for (const raw of lines) {
    const line = raw.trim();
    if (!line) { if (cur) cur.gapAfter = paraGap; cur = null; continue; }
    const m = SPEAKER_RE.exec(line);
    const member = m && byName.get(m[1].trim().toLowerCase());
    if (member) { cur = { castId: member.id, text: m[2], gapAfter: lineGap }; blocks.push(cur); }
    else if (cur) cur.text += ' ' + line;
    else { cur = { castId: cast[0].id, text: line, gapAfter: lineGap }; blocks.push(cur); }
  }
  return blocks.filter(b => b.text.trim());
}
function detectSpeakers(text, cast) {
  const known = new Set(cast.map(c => c.name.trim().toLowerCase()));
  const found = new Map();
  for (const raw of text.split('\n')) {
    const m = SPEAKER_RE.exec(raw.trim());
    if (m && m[2].trim() && m[1].split(' ').length <= 4) { const k = m[1].trim(); if (!known.has(k.toLowerCase())) found.set(k.toLowerCase(), (found.get(k.toLowerCase()) || { name: k, n: 0 })), found.get(k.toLowerCase()).n++; }
  }
  return [...found.values()];
}
function buildTimeline(ch) {
  const p = S.project;
  const blocks = parseScript(ch.script || '', p.cast, p.paraGap, p.lineGap);
  // reuse audio for unchanged lines
  const old = new Map();
  for (const c of ch.clips) if (c.seq != null && c.kind === 'tts' && !c.cut && c.audioId) old.set(c.castId + '\u0001' + c.text, c);
  ch.clips = ch.clips.filter(c => c.seq == null);
  blocks.forEach((b, i) => {
    const cast = castById(b.castId);
    const tr = voiceTrackFor(ch, b.castId);
    const prev = old.get(b.castId + '\u0001' + b.text);
    const clip = { id: 'k_' + uid(), trackId: tr.id, kind: 'tts', castId: b.castId, text: b.text, start: 0, offset: 0, gain: 1, fadeIn: 0, fadeOut: 0, seq: i, gapAfter: b.gapAfter, status: 'pending', dur: estDur(b.text, cast.speed) };
    if (prev) Object.assign(clip, { audioId: prev.audioId, dur: prev.dur, offset: 0, genKey: prev.genKey, status: prev.genKey === genKey(cast) ? 'ready' : 'stale', gain: prev.gain, fadeIn: prev.fadeIn, fadeOut: prev.fadeOut });
    ch.clips.push(clip);
  });
  ch.autoFlow = true;
  // drop empty voice tracks that have no clips (except first)
  ch.tracks = ch.tracks.filter((t, i) => i === 0 || t.kind !== 'voice' || ch.clips.some(c => c.trackId === t.id));
  return blocks.length;
}
function splitBook(text) {
  const lines = text.replace(/\r/g, '').split('\n');
  const HEAD = /^\s*(#{1,3}\s+.+|(chapter|part|prologue|epilogue)\b.{0,60})\s*$/i;
  const out = []; let cur = null;
  for (const l of lines) {
    if (HEAD.test(l) && l.trim().length < 80) { cur = { title: l.replace(/^\s*#{1,3}\s*/, '').trim(), lines: [] }; out.push(cur); }
    else { if (!cur) { cur = { title: 'Opening', lines: [] }; out.push(cur); } cur.lines.push(l); }
  }
  return out.map(c => ({ title: c.title, script: c.lines.join('\n').trim() })).filter(c => c.script || out.length === 1);
}

/* ---------- generation ---------- */
async function generate(clips, title) {
  const p = S.project;
  const todo = clips.filter(c => c.kind === 'tts' && !c.cut && c.status !== 'ready');
  if (!todo.length) { toast('All speech is already generated.'); return true; }
  Progress.open(title || 'Generating speech');
  const t0 = performance.now(); let doneChars = 0; const totalChars = todo.reduce((a, c) => a + c.text.length, 0);
  try {
    await Engine.ensure(p.engine, (f, msg) => Progress.set(f, msg));
    for (let i = 0; i < todo.length; i++) {
      if (Progress.cancelled) throw new Error('Cancelled');
      const c = todo[i], cast = castById(c.castId);
      const el = (performance.now() - t0) / 1000;
      const eta = doneChars ? el / doneChars * (totalChars - doneChars) : 0;
      Progress.set(i / todo.length, `Clip ${i + 1} of ${todo.length} · ${cast.name} (${voiceName(cast.voice)})${eta > 5 ? ` · about ${fmtLong(eta)} left` : ''}`);
      try {
        const r = await Engine.synth(p.engine, c.text, cast.voice, cast.speed);
        const ch = await resampleChannels([r.data], r.sr, p.sampleRate, 1);
        const id = await AudioLib.save(ch, p.sampleRate);
        const [vs, ve] = Captions.speechBounds(ch[0], p.sampleRate);
        Object.assign(c, { audioId: id, dur: ch[0].length / p.sampleRate, genDur: ch[0].length / p.sampleRate, vs, ve, offset: 0, status: 'ready', genKey: genKey(cast), error: null });
      } catch (e) {
        if (Progress.cancelled) throw e;
        c.status = 'error'; c.error = e.message || String(e);
        console.error(e);
      }
      doneChars += c.text.length;
      for (const chp of p.chapters) reflow(chp);
      save();
      if (S.tab === 'studio') Studio.renderTimeline();
    }
    Progress.close();
    const errs = todo.filter(c => c.status === 'error').length;
    toast(errs ? `${errs} clip(s) failed — tap them to retry.` : `Generated ${todo.length} clip(s) in ${fmtLong((performance.now() - t0) / 1000)}.`);
    render();
    return !errs;
  } catch (e) {
    Progress.close(); save(); render();
    if (e.message !== 'Cancelled') ask('Voice engine problem', esc(e.message || e), [{ label: 'OK', primary: true }]); else toast('Stopped.');
    return false;
  }
}

/* ---------- GC unreferenced audio ---------- */
async function gcAudio() {
  try {
    const projects = await DB.all('projects');
    const used = new Set();
    for (const p of projects) for (const ch of p.chapters) for (const c of ch.clips) if (c.audioId) used.add(c.audioId);
    if (S.project) for (const ch of S.project.chapters) for (const c of ch.clips) if (c.audioId) used.add(c.audioId);
    for (const u of S.undo.concat(S.redo)) for (const m of u.matchAll(/"audioId":"([^"]+)"/g)) used.add(m[1]);
    const keys = await DB.keys('audio');
    for (const k of keys) if (!used.has(k)) await AudioLib.remove(k);
  } catch (e) { console.warn('gc', e); }
}

}

async function onProjectClick(e) {
  const t = e.target.closest('[data-tab]');
  if (t) { if (S.tab !== t.dataset.tab) { if (t.dataset.tab !== 'studio') Player.stop(); S.tab = t.dataset.tab; render(); } return; }
  const a = e.target.closest('[data-a]'); if (!a) return;
  const p = S.project, ch = chapter();
  switch (a.dataset.a) {
    case 'home': Player.stop(); await save(true); S.view = 'home'; S.project = null; render(); break;
    case 'ch-add': {
      const t = await promptText('New chapter', `Chapter ${p.chapters.length + 1}`);
      if (t) mutate(() => { const c = newChapter(t); c.tracks[0].castId = p.cast[0].id; c.tracks[0].name = p.cast[0].name; p.chapters.splice(p.chapters.indexOf(ch) + 1, 0, c); S.chapterId = c.id; S.sel = null; });
      break;
    }
    case 'ch-menu': {
      const i = p.chapters.indexOf(ch);
      const act = await ask(ch.title, `Chapter ${i + 1} of ${p.chapters.length}`, [
        { label: 'Rename', value: 'ren' }, { label: 'Move up', value: 'up' }, { label: 'Move down', value: 'down' }, { label: 'Duplicate', value: 'dup' },
        { label: 'Delete chapter', value: 'del', danger: true }, { label: 'Cancel', value: null }]);
      if (act === 'ren') { const t = await promptText('Rename chapter', ch.title); if (t) mutate(() => { ch.title = t; }); }
      if (act === 'up' && i > 0) mutate(() => { p.chapters.splice(i, 1); p.chapters.splice(i - 1, 0, ch); });
      if (act === 'down' && i < p.chapters.length - 1) mutate(() => { p.chapters.splice(i, 1); p.chapters.splice(i + 1, 0, ch); });
      if (act === 'dup') mutate(() => { const c = JSON.parse(JSON.stringify(ch)); c.id = 'c_' + uid(); c.title += ' (copy)'; c.clips.forEach(k => k.id = 'k_' + uid()); p.chapters.splice(i + 1, 0, c); S.chapterId = c.id; });
      if (act === 'del') {
        if (p.chapters.length === 1) return toast('A project needs at least one chapter.');
        if (await ask('Delete chapter?', `“${esc(ch.title)}” and its timeline will be removed. You can undo this in the Studio.`, [{ label: 'Cancel', value: false }, { label: 'Delete', value: true, danger: true }]))
          mutate(() => { p.chapters.splice(i, 1); S.chapterId = p.chapters[Math.max(0, i - 1)].id; S.sel = null; });
      }
      break;
    }
  }
}

    </div></div>`;
  const ta = $('#scr');
  ta.oninput = () => { ch.script = ta.value; save(); const b = parseScript(ta.value, p.cast, p.paraGap, p.lineGap); $('#scr-info').textContent = `${b.length} line${b.length === 1 ? '' : 's'} · edits not on the timeline until you rebuild`; };

  main.onclick = async e => {

      if (ch.clips.some(c => c.seq == null && c.kind === 'tts') || (!ch.autoFlow && ch.clips.some(c => c.seq != null))) {
        const ok = await ask('Rebuild timeline?', 'Script clips will be laid out again from the text. Clips you moved by hand will snap back into reading order; music and imported audio stay where they are.', [{ label: 'Cancel', value: false }, { label: 'Rebuild', value: true, primary: true }]);
        if (!ok) return;
      }
      let n; mutate(() => { n = buildTimeline(ch); }, { render: false });
      const need = ch.clips.filter(c => c.kind === 'tts' && c.status !== 'ready').length;
      toast(`${n} clips on the timeline${need ? ` · ${need} need audio` : ''}`);
      if (need && await ask('Generate audio now?', `${need} clip${need === 1 ? '' : 's'} need speech. You can also do this later from the Studio.`, [{ label: 'Later', value: false }, { label: 'Generate', value: true, primary: true }])) await generate(ch.clips);
      S.tab = 'studio'; render();
    }
    if (k === 'gen') {
      if (!ch.clips.some(c => c.kind === 'tts')) { mutate(() => buildTimeline(ch), { render: false }); }
      await generate(ch.clips);
    }
    if (k === 'scan-cam' || k === 'scan-lib') {

        toast('Scanned text added to the end of this chapter.');
      });
      return;
    }
    if (k === 'speakers') {
      const found = detectSpeakers(ch.script, p.cast);
      if (!found.length) return toast('No new “Name:” speakers found.');
      const ok = await ask('Add characters?', `Found: ${found.map(f => `<b>${esc(f.name)}</b> (${f.n})`).join(', ')}. Each gets its own voice and track — change voices in the Voices tab.`, [{ label: 'Cancel', value: false }, { label: 'Add all', value: true, primary: true }]);
      if (ok) mutate(() => found.forEach(f => addCast(f.name)));
    }
    if (k === 'book') { const t = await promptText('Import whole book', '', { multi: true, ok: 'Split into chapters', hint: 'New chapters start at lines like “# Title”, “Chapter 4” or “Prologue”.' }); if (t) importBook(t); }

}
function importBook(text) {
  const parts = splitBook(text);
  if (!parts.length) return toast('No text found.');
  const p = S.project;
  mutate(() => {
    const emptyOnly = p.chapters.length === 1 && !p.chapters[0].script.trim() && !p.chapters[0].clips.length;
    if (emptyOnly) p.chapters = [];
    for (const part of parts) { const c = newChapter(part.title); c.tracks[0].castId = p.cast[0].id; c.tracks[0].name = p.cast[0].name; c.script = part.script; p.chapters.push(c); }
    S.chapterId = p.chapters[emptyOnly ? 0 : p.chapters.length - parts.length].id;
  });
  toast(`Imported ${parts.length} chapter${parts.length === 1 ? '' : 's'}.`);
}

/* ---------- Voices (cast) tab ---------- */
function addCast(name) {
  const p = S.project;
  const used = new Set(p.cast.map(c => c.voice));
  const pickV = (VOICES.find(v => !used.has(v[0])) || VOICES[p.cast.length % VOICES.length])[0];
  const c = { id: 'v_' + uid(), name, voice: pickV, speed: 1, color: COLORS[p.cast.length % COLORS.length] };
  p.cast.push(c); return c;
}
function voiceOptions(sel) {
  const groups = {};
  for (const [id, n, g] of VOICES) (groups[g] = groups[g] || []).push(`<option value="${id}" ${id === sel ? 'selected' : ''}>${n}</option>`);
  return Object.entries(groups).map(([g, o]) => `<optgroup label="${g}">${o.join('')}</optgroup>`).join('');
}
function renderCast(main) {
  const p = S.project;
  main.innerHTML = `<div class="wrap">

        <div class="full btns" style="margin-top:4px"><button class="btn sm" data-x="hear">Hear sample</button>${i > 0 ? '<button class="btn sm d" data-x="del">Remove</button>' : ''}</div>
      </div>`).join('')}
      <div class="btns full"><button class="btn" data-x="add">+ Add character</button></div>
    </div></div>`;
  main.oninput = e => {
    const it = e.target.closest('[data-c]'); if (!it || e.target.dataset.k !== 'speed') return;
    it.querySelector('.rangev').textContent = Number(e.target.value).toFixed(2) + '×';
  };
  main.onchange = e => {
    const it = e.target.closest('[data-c]'); if (!it) return;
    const c = p.cast.find(x => x.id === it.dataset.c), k = e.target.dataset.k;
    mutate(() => {
      if (k === 'name') { c.name = e.target.value.trim() || c.name; for (const ch of p.chapters) for (const t of ch.tracks) if (t.castId === c.id) t.name = c.name; }
      if (k === 'voice' || k === 'speed') {
        c[k] = k === 'speed' ? Number(e.target.value) : e.target.value;
        let n = 0;
        for (const ch of p.chapters) for (const cl of ch.clips) if (cl.castId === c.id && cl.status === 'ready' && !cl.cut) { cl.status = 'stale'; n++; }
        if (n) toast(`${n} ${c.name} clip${n === 1 ? '' : 's'} will be regenerated next time you generate.`);
      }
    }, { render: k !== 'name' });
  };
  main.onclick = async e => {
    const b = e.target.closest('[data-x]'); if (!b) return;
    const it = e.target.closest('[data-c]'), c = it && p.cast.find(x => x.id === it.dataset.c);
    if (b.dataset.x === 'add') { const n = await promptText('Character name', ''); if (n && n.trim()) mutate(() => addCast(n.trim())); }
    if (b.dataset.x === 'del') {
      const used = p.chapters.some(ch => ch.clips.some(k => k.castId === c.id));
      if (await ask('Remove ' + c.name + '?', used ? 'Their clips will be read by ' + esc(p.cast[0].name) + ' instead (and regenerated).' : 'This character isn’t used yet.', [{ label: 'Cancel', value: false }, { label: 'Remove', value: true, danger: true }]))
        mutate(() => {
          p.cast = p.cast.filter(x => x !== c);
          for (const ch of p.chapters) {
            const nt = voiceTrackFor(ch, p.cast[0].id);
            for (const k of ch.clips) if (k.castId === c.id) { k.castId = p.cast[0].id; k.trackId = nt.id; if (!k.cut) k.status = 'stale'; }

    }
  };

      <div class="btns full"><button class="btn sm" data-q="srt">Save words (.srt)</button></div>
    </div>`;
  }

  function bind(root) {
    const q = id => $('#' + id, root);
    if (!q('q-text')) return;
    q('q-text').oninput = e => { st.text = e.target.value; q('q-count').textContent = st.text.length.toLocaleString() + ' characters'; persist(); };
    q('q-voice').onchange = e => { st.voice = e.target.value; persist(); };
    q('q-speed').oninput = e => { st.speed = Number(e.target.value); q('q-sv').textContent = st.speed.toFixed(2) + '×'; persist(); };
    q('q-name').oninput = e => { st.name = e.target.value; persist(); };
    q('q-br').onchange = e => { st.bitrate = Number(e.target.value); persist(); };
    attachCaptions(root);
  }
  function attachCaptions(root) {
    const a = $('#q-audio', root), box = $('#q-cap', root), rb = $('#q-rsvp', root);
    if (!a || !box) return;
    const list = Captions.flat(result.segs);
    let raf = 0;
    const show = () => {
      if (st.capMode === 'text') Captions.highlight(box, a.currentTime);
      else if (st.capMode === 'rsvp') Captions.rsvp(rb, list, a.currentTime, 0, a.duration || result.secs);
    };
    const loop = () => { show(); if (!a.paused) raf = requestAnimationFrame(loop); };
    a.onplay = () => { cancelAnimationFrame(raf); loop(); };
    a.onseeked = a.ontimeupdate = show;
    box.onclick = e => { const w = e.target.closest('.cw'); if (w) { a.currentTime = +w.dataset.s + 0.001; show(); } };
    rb.onclick = () => { if (a.paused) a.play().catch(() => {}); else a.pause(); };
    show();
  }

  async function onClick(e, root) {
    const f = e.target.closest('[data-qf]');
    if (f) {
      st.fmt = f.dataset.qf; persist();
      root.querySelectorAll('[data-qf]').forEach(x => { const on = x.dataset.qf === st.fmt; x.classList.toggle('on', on); x.setAttribute('aria-checked', on); });
      const br = $('#q-br', root); if (br) br.disabled = st.fmt === 'wav';
      return true;
    }
    const qc = e.target.closest('[data-qc]');
    if (qc) {
      st.capMode = qc.dataset.qc; persist();
      root.querySelectorAll('[data-qc]').forEach(x => { const on = x.dataset.qc === st.capMode; x.classList.toggle('on', on); x.setAttribute('aria-checked', on); });
      $('#q-cap', root).classList.toggle('hidden', st.capMode !== 'text');
      $('#q-rsvp', root).classList.toggle('hidden', st.capMode !== 'rsvp');
      const a = $('#q-audio', root); if (a) a.ontimeupdate && a.ontimeupdate();
      return true;
    }
    const b = e.target.closest('[data-q]'); if (!b) return false;
    switch (b.dataset.q) {
      case 'toggle': st.open = !st.open; persist(); render(); break;
      case 'hear': {
        b.disabled = true; const old = b.textContent;
        try {
          await Engine.ensure(st.engine, f => { b.textContent = Math.round(f * 100) + '%'; });
          b.textContent = 'Speaking…';
          const r = await Engine.synth(st.engine, `Hello, this is ${voiceName(st.voice)}.`, st.voice, st.speed);
          await Player.playRaw([r.data], r.sr);
        } catch (err) { ask('Voice engine problem', esc(err.message || err), [{ label: 'OK', primary: true }]); }
        b.disabled = false; b.textContent = old; break;
      }
      case 'make': await make(root); break;
      case 'scan-cam': case 'scan-lib':
        Scan.start(b.dataset.q === 'scan-cam', async text => {
          let mode = 'replace';
          if (st.text.trim()) mode = await ask('Add scanned text', 'There\u2019s already text in Quick speech.', [{ label: 'Add to the end', value: 'add', primary: true }, { label: 'Replace it', value: 'replace' }, { label: 'Cancel', value: null }]);
          if (!mode) return;
          st.text = mode === 'add' ? st.text.trim() + '\n\n' + text : text; persist();
          const ta = $('#q-text', root); if (ta) { ta.value = st.text; $('#q-count', root).textContent = st.text.length.toLocaleString() + ' characters'; ta.scrollIntoView({ block: 'center' }); }
          toast('Text ready — tap Create audio.');
        });
        break;
      case 'srt': if (result) await deliver([{ blob: new Blob([Captions.srt(result.segs)], { type: 'text/plain' }), name: result.name.replace(/\.[^.]+$/, '.srt') }], 'text/plain'); break;
      case 'save': if (result) await deliver([{ blob: result.blob, name: result.name }], result.blob.type); break;
      case 'toproject': {
        const p = newProject(st.name.trim() || 'Quick speech');
        p.cast[0].voice = st.voice; p.cast[0].speed = st.speed;
        p.chapters[0].script = st.text;
        await DB.put('projects', p);
        await openProject(p.id, 'script');
        toast('Project created — tap “Build timeline” to lay it out.');
        break;
      }
    }
    return true;
  }

  async function make(root) {
    const text = st.text.trim();
    if (!text) return toast('Type some text first.');
    const paras = text.replace(/\r/g, '').split(/\n\s*\n+/).map(p => p.trim()).filter(Boolean);
    const pieces = paras.map((p, i) => chunkText(p).map((c, j, arr) => ({ text: c, gap: j === arr.length - 1 ? (i === paras.length - 1 ? 0.4 : 0.7) : 0.12 }))).flat();
    const sr = 24000;
    Progress.open('Creating audio');
    try {
      if (st.fmt === 'm4a' && !(await Encoders.aacSupported(sr, 1, st.bitrate * 1000))) throw new Error('This iPhone can’t make M4A files (needs iOS 26 or later). Choose MP3 instead.');
      await Engine.ensure(st.engine, (f, m) => Progress.set(f, m));
      const enc = st.fmt === 'wav' ? Encoders.wav(sr, 1) : st.fmt === 'mp3' ? Encoders.mp3(sr, 1, st.bitrate) : Encoders.aac(sr, 1, st.bitrate, 'M4A ');
      const t0 = performance.now(); let done = 0, frames = 0; const segs = [];
      const total = pieces.reduce((a, p) => a + p.text.length, 0);
      for (let i = 0; i < pieces.length; i++) {
        if (Progress.cancelled) throw new Error('Cancelled');
        const el = (performance.now() - t0) / 1000, eta = done ? el / done * (total - done) : 0;
        Progress.set(i / pieces.length, `Speaking part ${i + 1} of ${pieces.length}${eta > 5 ? ` · about ${fmtLong(eta)} left` : ''}`);
        const r = await Engine.synth(st.engine, pieces[i].text, st.voice, st.speed);
        const [data] = await resampleChannels([r.data], r.sr, sr, 1);
        const gap = new Float32Array(Math.round(pieces[i].gap * sr));
        const [vs, ve] = Captions.speechBounds(data, sr);
        segs.push({ text: pieces[i].text, s: frames / sr + vs, e: frames / sr + ve });
        await enc.write([data]); await enc.write([gap]);
        frames += data.length + gap.length; done += pieces[i].text.length;
      }
      Progress.set(1, 'Finishing file…');
      const name = safeName(st.name.trim() || text.slice(0, 40)) + '.' + st.fmt;
      const blob = await enc.finish({ title: st.name.trim() || text.slice(0, 60), artist: voiceName(st.voice), genre: 'Speech' }, null);
      if (result) URL.revokeObjectURL(result.url);
      result = { blob, url: URL.createObjectURL(blob), name, secs: frames / sr, segs };
      window.__lastQuick = result;
      Progress.close();
      const r = $('#q-result', root); if (r) { r.innerHTML = resultHtml(); attachCaptions(root); }
      toast(`Created ${fmtLong(result.secs)} of audio.`);
    } catch (e) {
      Progress.close();
      if (e.message !== 'Cancelled') ask('Couldn’t create audio', esc(e.message || e), [{ label: 'OK', primary: true }]); else toast('Stopped.');
    }
  }

  return { html, bind, onClick };
})();

/* ===== Player (Web Audio) ===== */
const Player = (() => {
  let ctx = null, nodes = [], playing = false, t0 = 0, p0 = 0, raf = 0, bufs = new Map(), bufCh = null;
  function ensure() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext; ctx = new AC();
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {}
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function toBuffer(rec) {
    const b = ctx.createBuffer(rec.ch.length, rec.len, rec.sr);
    rec.ch.forEach((d, i) => b.getChannelData(i).set(d));
    return b;
  }
  async function buffer(id) {
    if (bufs.has(id)) return bufs.get(id);
    const b = toBuffer(await AudioLib.load(id)); bufs.set(id, b); return b;
  }
  function stopNodes() { for (const n of nodes) { try { n.stop(); } catch {} try { n.disconnect(); } catch {} } nodes = []; }
  const pos = () => playing ? p0 + (ctx.currentTime - t0) : S.playhead;
  function tick() {
    if (!playing) return;
    const t = pos(), ch = chapter();
    S.playhead = t;
    Studio.updatePlayhead(true);
    if (!ch || t > Mixer.chapterLength(ch) + 0.3) { stop(); Studio.updateTransport(); return; }
    raf = requestAnimationFrame(tick);
  }
  async function play() {
    ensure();
    const ch = chapter();
    if (bufCh !== ch.id) { bufs = new Map(); bufCh = ch.id; }
    const tracks = Mixer.audibleTracks(ch);
    const clips = ch.clips.filter(c => tracks.has(c.trackId) && c.audioId && c.status !== 'pending' && c.status !== 'error' && c.start + c.dur > S.playhead);
    if (S.playhead >= Mixer.chapterLength(ch) - 0.05) S.playhead = 0;
    Studio.setBusy('Loading…');
    try { for (const c of clips) await buffer(c.audioId); } finally { Studio.setBusy(null); }
    stopNodes();
    const start = ctx.currentTime + 0.06, from = S.playhead;
    const tgNodes = new Map();
    for (const [id, t] of tracks) { const g = ctx.createGain(); g.gain.value = t.gain == null ? 1 : t.gain; g.connect(ctx.destination); tgNodes.set(id, g); nodes.push({ stop() {}, disconnect: () => g.disconnect() }); }
    for (const c of clips) {
      if (c.start + c.dur <= from) continue;
      const local = Math.max(0, from - c.start), when = start + Math.max(0, c.start - from);
      const src = ctx.createBufferSource(); src.buffer = bufs.get(c.audioId);
      const g = ctx.createGain();
      src.connect(g); g.connect(tgNodes.get(c.trackId));
      g.gain.setValueAtTime(Mixer.envAt(c, local), when);
      const pts = [c.fadeIn || 0, c.dur - (c.fadeOut || 0), c.dur].filter(x => x > local + 0.001).sort((a, b) => a - b);
      for (const pt of pts) g.gain.linearRampToValueAtTime(Mixer.envAt(c, Math.min(pt, c.dur - 0.0001)), when + (pt - local));
      const dur = Math.max(0.001, c.dur - local);
      src.start(when, (c.offset || 0) + local, dur);
      nodes.push(src);
    }
    t0 = start; p0 = from; playing = true;
    cancelAnimationFrame(raf); raf = requestAnimationFrame(tick);
  }
  function stop() {
    if (playing) S.playhead = pos();
    playing = false; cancelAnimationFrame(raf); stopNodes();
  }
  async function playRaw(ch, sr) {
    ensure(); stop();
    const b = ctx.createBuffer(ch.length, ch[0].length, sr); ch.forEach((d, i) => b.getChannelData(i).set(d));
    const s = ctx.createBufferSource(); s.buffer = b; s.connect(ctx.destination); s.start(); nodes.push(s);
    return new Promise(r => { s.onended = r; });
  }
  return { play, stop, playRaw, get playing() { return playing; }, pos, ensure, clearCache() { bufs = new Map(); } };
})();

/* ===== Studio (multi-track timeline) ===== */
const Studio = (() => {
  let root = null;
  const HDRW = 104;
  const xOf = t => HDRW + t * S.pps;
  const laneLen = ch => Math.max(60, Mixer.chapterLength(ch) + 30);

  function render(main) {

          <button class="btn sm" data-t="split">${ICON.cut.replace('<svg', '<svg width="16" height="16" style="vertical-align:-3px"')} Split</button>
          <button class="btn sm" data-t="addtrack">+ Track</button>
          <button class="btn sm cc-btn ${S.cc ? 'on' : ''}" data-t="cc" aria-pressed="${S.cc}" aria-label="Show words while playing">CC</button>
          <label class="btn sm">${ICON.music.replace('<svg', '<svg width="16" height="16" style="vertical-align:-3px"')} Import<input type="file" accept="audio/*,.mp3,.m4a,.wav,.aac" id="impfile" hidden multiple></label>
        </div>
        <span id="busy" class="small muted"></span>
      </div>
      <div class="tl" id="tl"></div>
      <div class="ccbar ${S.cc ? '' : 'hidden'} ${S.ccMode === 'rsvp' ? 'rsvp-mode' : ''}" id="cc">
        <div class="ccmode seg" role="radiogroup" aria-label="Word display">${[['text', 'Text'], ['rsvp', 'Speed']].map(([k, l]) => `<button type="button" role="radio" data-ccm="${k}" aria-checked="${S.ccMode === k}" class="${S.ccMode === k ? 'on' : ''}">${l}</button>`).join('')}</div>
        <div id="ccb"></div>
      </div>
      <div class="insp" id="insp"></div>
      <div class="dock">
        <span class="time ptime">${fmtT(S.playhead)}</span>
        <div class="dbtns">
          <button class="ib" data-t="start" aria-label="To start">${ICON.start}</button>
          <button class="ib" data-t="undo" ${S.undo.length ? '' : 'disabled'} aria-label="Undo">${ICON.undo}</button>
          <button class="ib p big" data-t="play" aria-label="Play">${Player.playing ? ICON.pause : ICON.play}</button>
          <button class="ib" data-t="redo" ${S.redo.length ? '' : 'disabled'} aria-label="Redo">${ICON.redo}</button>
          <button class="ib" data-t="zout" aria-label="Zoom out">${ICON.zout}</button>
          <button class="ib" data-t="zin" aria-label="Zoom in">${ICON.zin}</button>
        </div>
      </div>`;
    main.onclick = onTransport;
    $('#cc').onclick = e => {
      const m = e.target.closest('[data-ccm]');
      if (m) {
        e.stopPropagation(); S.ccMode = m.dataset.ccm; try { localStorage.setItem('abs_ccmode', S.ccMode); } catch {}
        $('#cc').classList.toggle('rsvp-mode', S.ccMode === 'rsvp');
        $('#cc').querySelectorAll('[data-ccm]').forEach(x => { const on = x.dataset.ccm === S.ccMode; x.classList.toggle('on', on); x.setAttribute('aria-checked', on); });
        ccKey = null; updateCaptions(); return;
      }
      if (S.ccMode === 'rsvp' && e.target.closest('.rsvp')) { e.stopPropagation(); if (Player.playing) Player.stop(); else Player.play().then(updateTransport); updateTransport(); return; }
      const w = e.target.closest('.cw'); if (!w) return; e.stopPropagation(); const was = Player.playing; Player.stop(); S.playhead = +w.dataset.s + 0.001; updatePlayhead(true); if (was) Player.play().then(updateTransport); };
    ccKey = null;
    $('#impfile').onchange = e => importAudio([...e.target.files]);
    renderTimeline();
    renderInspector();
    bindPointer($('#tl'));
    updateCaptions();
  }

  function renderTimeline() {
    const tl = root && root.isConnected && $('#tl', root); if (!tl) return;
    const ch = chapter(), len = laneLen(ch), W = HDRW + len * S.pps;
    const sl = tl.scrollLeft, st = tl.scrollTop;
    const step = S.pps >= 80 ? 1 : S.pps >= 30 ? 5 : S.pps >= 10 ? 15 : S.pps >= 3 ? 60 : 300;
    let ticks = '';
    for (let t = 0; t <= len; t += step) ticks += `<div class="tick" style="left:${t * S.pps}px">${fmtT(t).replace(/\.0$/, '')}</div>`;
    const rows = ch.tracks.map(t => {
      const clips = ch.clips.filter(c => c.trackId === t.id).map(c => clipHtml(c, t)).join('');
      return `<div class="trow" data-track="${t.id}">
        <div class="hdr ${S.selTrack === t.id ? 'sel' : ''}" style="--c:${t.color}" data-hdr="${t.id}">
          <span class="tn">${esc(t.name)}</span>
          <span class="tb"><button class="m ${t.mute ? 'on' : ''}" data-mute="${t.id}">M</button><button class="s ${t.solo ? 'on' : ''}" data-solo="${t.id}">S</button></span>
        </div>
        <div class="lane" data-lane="${t.id}">${clips}</div></div>`;
    }).join('');
    tl.innerHTML = `<div class="tl-inner" style="width:${W}px">
      <div class="trow ruler-row"><div class="hdr" style="border-left-color:transparent"><span class="small muted">${fmtLong(Mixer.chapterLength(ch))}</span></div><div class="ruler" data-ruler="1">${ticks}</div></div>
      ${rows}
      <div class="playhead" id="ph" style="left:${xOf(S.playhead)}px"></div></div>`;
    tl.scrollLeft = sl; tl.scrollTop = st;
    drawWaves(tl);
  }

  function clipHtml(c, t) {
    const cls = ['clip', S.sel === c.id && 'sel', c.status === 'pending' && 'pending', c.status === 'stale' && 'stale', c.status === 'error' && 'err'].filter(Boolean).join(' ');
    const label = c.kind === 'tts' ? (c.status === 'error' ? '⚠ ' : '') + c.text : c.name || 'Audio';
    return `<div class="${cls}" data-clip="${c.id}" style="left:${c.start * S.pps}px;width:${Math.max(4, c.dur * S.pps)}px;--c:${t.color}"><canvas></canvas><span class="lbl">${esc(label.slice(0, 160))}</span><i class="h h-l" data-h="l"></i><i class="h h-r" data-h="r"></i></div>`;
  }

  function drawWaves(tl) {
    const ch = chapter();
    const color = getComputedStyle(document.documentElement).getPropertyValue('--wave').trim() || '#000';
    tl.querySelectorAll('.clip').forEach(async el => {
      const c = ch.clips.find(k => k.id === el.dataset.clip); if (!c || !c.audioId) return;
      let rec = AudioLib.peek(c.audioId);
      if (!rec) { try { rec = await AudioLib.load(c.audioId); } catch { return; } if (!el.isConnected) return; }
      const cv = el.querySelector('canvas'), w = Math.min(2048, Math.max(4, Math.round(c.dur * S.pps))), h = 54;
      cv.width = w; cv.height = h;
      const g = cv.getContext('2d'); g.fillStyle = color; g.globalAlpha = 0.45;
      const p = rec.peaks, pps = 100, mid = h / 2 + 5;
      for (let x = 0; x < w; x++) {
        const t = (c.offset || 0) + x / w * c.dur;
        const i = Math.floor(t * pps); if (i >= p.length) break;
        const env = Mixer.envAt(c, x / w * c.dur);
        const a = Math.min(1, p[i] * env * 1.6) * (h / 2 - 8);
        g.fillRect(x, mid - a, 1, Math.max(1, a * 2));
      }
      // fade guides
      g.globalAlpha = 0.9; g.strokeStyle = color; g.lineWidth = 1.2; g.beginPath();
      const fx = (c.fadeIn || 0) / c.dur * w, fo = (c.fadeOut || 0) / c.dur * w;
      if (fx > 1) { g.moveTo(0, h); g.lineTo(fx, 12); }
      if (fo > 1) { g.moveTo(w - fo, 12); g.lineTo(w, h); }
      g.stroke();
    });
  }

  let ccKey = null, ccList = null;
  function updateCaptions() {
    const bar = $('#cc'), box = $('#ccb'); if (!box || !S.cc) return;
    const ch = chapter(), t = S.playhead, tracks = Mixer.audibleTracks(ch);
    const tts = ch.clips.filter(c => c.kind === 'tts' && tracks.has(c.trackId) && c.audioId).sort((a, b) => a.start - b.start);
    const segOf = c => {
      const g = c.genDur || (c.dur + (c.offset || 0)), base = c.start - (c.offset || 0);
      const tr = trackById(c.trackId), cast = castById(c.castId);
      return { text: c.text, s: base + (c.vs || 0), e: base + (c.ve || g), who: S.project.cast.length > 1 ? cast.name : '', color: tr && tr.color };
    };
    if (S.ccMode === 'rsvp') {
      const key = 'rsvp:' + tts.map(c => c.id + c.start + c.dur).join();
      if (key !== ccKey) { ccKey = key; ccList = Captions.flat(tts.map(segOf)).sort((a, b) => a.s - b.s); box.innerHTML = Captions.rsvpHtml(); bar.classList.remove('dim'); }
      Captions.rsvp(box, ccList, t, 0, Mixer.chapterLength(ch));
      return;
    }
    let act = tts.filter(c => t >= c.start && t < c.start + c.dur);
    let upcoming = false;
    if (!act.length) { const nx = tts.find(c => c.start > t); if (nx) { act = [nx]; upcoming = true; } else { const pv = tts.filter(c => c.start + c.dur <= t).pop(); if (pv) act = [pv]; } }
    const key = act.map(c => c.id).join() + (upcoming ? '~' : '');
    if (key !== ccKey) {
      ccKey = key;
      bar.classList.toggle('dim', upcoming);
      box.innerHTML = act.length ? Captions.html(act.map(segOf)) : '<p class="cseg muted small">Words appear here while the chapter plays.</p>';
    }
    Captions.highlight(box, t);
  }
  function updatePlayhead(follow) {
    const ph = $('#ph');
    if (ph) ph.style.left = xOf(S.playhead) + 'px';
    document.querySelectorAll('.ptime').forEach(tm => { tm.textContent = fmtT(S.playhead); });
    if (follow) {
      const tl = $('#tl'); if (!tl) return;
      const x = xOf(S.playhead);
      if (x > tl.scrollLeft + tl.clientWidth - 40 || x < tl.scrollLeft + HDRW) tl.scrollLeft = x - HDRW - 20;
    }
    updateCaptions();
  }
  function updateTransport() { document.querySelectorAll('[data-t=play]').forEach(b => { b.innerHTML = Player.playing ? ICON.pause : ICON.play; b.setAttribute('aria-label', Player.playing ? 'Pause' : 'Play'); }); updatePlayhead(); }
  function setBusy(t) { const b = $('#busy'); if (b) b.textContent = t || ''; }

  /* ----- transport actions ----- */
  async function onTransport(e) {

/* ===== Export ===== */
function dataUrlBytes(u) {
  const [h, b] = u.split(','); const bin = atob(b); const a = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
