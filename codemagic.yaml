# Codemagic: build Audiobook Studio for iOS and upload to TestFlight.
workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Berfau ASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.stevenwilliams.audiobookstudio
      vars:
        APP_STORE_APPLE_ID: 6835655115
      node: 20
      xcode: latest
    scripts:
      - name: Install packages
        script: npm install
      - name: Add iOS platform (first build only)
        script: |
          if [ ! -d ios ]; then npx cap add ios; fi
      - name: Raise minimum iOS version to 15.0
        script: &raise_ios |
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/App/App.xcodeproj/project.pbxproj
          if [ -f ios/App/Podfile ]; then sed -i '' "s/^platform :ios, .*/platform :ios, '15.0'/" ios/App/Podfile; fi
          if [ -f ios/App/CapApp-SPM/Package.swift ]; then sed -i '' 's/\.iOS(\.v1[0-4])/.iOS(.v15)/g' ios/App/CapApp-SPM/Package.swift; fi
          grep -m1 "IPHONEOS_DEPLOYMENT_TARGET" ios/App/App.xcodeproj/project.pbxproj
      - name: Copy web app into iOS project
        script: npx cap sync ios
      - name: Keep minimum iOS version at 15.0 after sync
        script: *raise_ios
      - name: Declare no non-exempt encryption (skips the export compliance question)
        script: |
          plutil -replace ITSAppUsesNonExemptEncryption -bool NO ios/App/App/Info.plist
      - name: Camera and photo permission messages (for scanning pages)
        script: |
          plutil -replace NSCameraUsageDescription -string "Audiobook Studio uses the camera to scan book pages into text." ios/App/App/Info.plist
          plutil -replace NSPhotoLibraryUsageDescription -string "Audiobook Studio reads photos of pages you choose to turn them into text." ios/App/App/Info.plist
      - name: Set up signing
        script: xcode-project use-profiles
      - name: Set build number (one higher than the latest on TestFlight)
        script: |
          cd ios/App
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          agvtool new-version -all $(($LATEST + 1))
      - name: Build IPA
        script: |
          if [ -d ios/App/App.xcworkspace ]; then
            xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
          else
            xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
          fi
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
