# Codemagic: build Audiobook Studio for iOS and upload to TestFlight.
workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Berfau ASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.stevenwilliams.audiobookstudio
      vars:
        APP_STORE_APPLE_ID: 6835655115
      node: 20
      xcode: latest
    scripts:
      - name: Install packages
        script: npm install
      - name: Add iOS platform (first build only)
        script: |
          if [ ! -d ios ]; then npx cap add ios; fi
      - name: Copy web app into iOS project
        script: npx cap sync ios
      - name: Declare no non-exempt encryption (skips the export compliance question)
        script: |
          plutil -replace ITSAppUsesNonExemptEncryption -bool NO ios/App/App/Info.plist
      - name: Set up signing
        script: xcode-project use-profiles
      - name: Set build number (one higher than the latest on TestFlight)
        script: |
          cd ios/App
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          agvtool new-version -all $(($LATEST + 1))
      - name: Build IPA
        script: |
          if [ -d ios/App/App.xcworkspace ]; then
            xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
          else
            xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
          fi
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
